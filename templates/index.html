<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Keystroke Auth</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            margin: 0;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 { color: #2d3748; text-align: center; }
        .info { background: #e6f3ff; padding: 15px; border-radius: 8px; margin: 20px 0; }
        textarea {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            font-family: monospace;
            min-height: 120px;
        }
        textarea:focus { outline: none; border-color: #667eea; }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 15px 0;
        }
        .stat {
            background: #667eea;
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .stat h4 { margin: 0; font-size: 12px; opacity: 0.9; }
        .stat p { margin: 5px 0 0 0; font-size: 24px; font-weight: bold; }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover { background: #5568d3; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .results { margin-top: 20px; }
        .result {
            background: #f7fafc;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 4px solid #667eea;
        }
        .best { background: #c6f6d5; border-left-color: #48bb78; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🔐 Keystroke Authentication</h1>
            <div class="info">
                <strong>Type anything!</strong> No specific text required. Just type naturally for 10-15 keystrokes.
            </div>
            
            <textarea id="input" placeholder="Start typing anything... Type freely and naturally!"></textarea>
            
            <div class="stats">
                <div class="stat">
                    <h4>Keystrokes</h4>
                    <p id="count">0</p>
                </div>
                <div class="stat">
                    <h4>Avg Dwell</h4>
                    <p id="dwell">0ms</p>
                </div>
                <div class="stat">
                    <h4>Avg Flight</h4>
                    <p id="flight">0ms</p>
                </div>
            </div>
            
            <button id="btn" disabled>Need 10+ keystrokes</button>
            <div class="results" id="results"></div>
        </div>
    </div>

    <script>
        let keys = [];
        let lastDown = null;
        let lastUp = null;

        document.getElementById('input').addEventListener('keydown', (e) => {
            const now = Date.now();
            keys.push({
                timestamp: now,
                flightTime: lastUp ? now - lastUp : 0,
                dwellTime: null
            });
            lastDown = now;
        });

        document.getElementById('input').addEventListener('keyup', (e) => {
            const now = Date.now();
            if (lastDown && keys.length > 0) {
                keys[keys.length - 1].dwellTime = now - lastDown;
            }
            lastUp = now;
            update();
        });

        function update() {
            document.getElementById('count').textContent = keys.length;
            
            const dwells = keys.filter(k => k.dwellTime).map(k => k.dwellTime);
            const flights = keys.filter(k => k.flightTime).map(k => k.flightTime);
            
            if (dwells.length) {
                document.getElementById('dwell').textContent = Math.round(dwells.reduce((a,b)=>a+b)/dwells.length) + 'ms';
            }
            if (flights.length) {
                document.getElementById('flight').textContent = Math.round(flights.reduce((a,b)=>a+b)/flights.length) + 'ms';
            }
            
            const btn = document.getElementById('btn');
            if (keys.length >= 10) {
                btn.disabled = false;
                btn.textContent = `🔐 Authenticate (${keys.length} keystrokes)`;
            }
        }

        document.getElementById('btn').addEventListener('click', async () => {
            const res = document.getElementById('results');
            res.innerHTML = '<p style="text-align:center">⏳ Authenticating...</p>';
            
            const response = await fetch('/api/authenticate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({keystrokes: keys})
            });
            
            const data = await response.json();
            
            if (data.success) {
                let html = `<div class="result best">✅ <strong>Best Match: ${data.best_model}</strong></div>`;
                for (const [name, r] of Object.entries(data.results)) {
                    html += `<div class="result">${name}: ${(r.confidence*100).toFixed(1)}%</div>`;
                }
                res.innerHTML = html;
            } else {
                res.innerHTML = `<div class="result">Error: ${data.error}</div>`;
            }
        });
    </script>
</body>
</html>
